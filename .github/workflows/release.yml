name: Release (versión jugable)

# fps-debug branch only: frame-trace experiments on WARP (no package, no
# release). Each matrix job builds the sandbox and runs one set of
# configurations of .github/scripts/fps_trace.sh.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "unused on fps-debug"
        required: false
        default: ""
      smoke_only:
        description: "unused on fps-debug (always smoke only)"
        type: boolean
        required: false
        default: true
      smoke_frames:
        description: "unused on fps-debug"
        required: false
        default: "100"

permissions:
  contents: read

jobs:
  trace:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        set: [after-h, after-w]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build
        run: cargo build --release --locked -p sandbox -p forja_fetch

      - name: Cache content packs
        uses: actions/cache@v4
        with:
          path: engine/assets/downloaded
          key: forja-assets-${{ hashFiles('engine/data/assets.toml', 'engine/data/assets.lock.toml') }}
          restore-keys: forja-assets-

      - name: Fetch content packs (play set)
        continue-on-error: true
        timeout-minutes: 20
        run: target/release/forja_fetch.exe fetch --play --missing --root .

      - name: CPU info
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed | Format-List
          [System.Environment]::OSVersion.VersionString

      - name: Frame traces (${{ matrix.set }})
        shell: bash
        timeout-minutes: 150
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../.github/scripts/fps_trace.sh ${{ matrix.set }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Forja-Windows-smoke-${{ matrix.set }}
          path: |
            engine/smoke/*.log
            engine/smoke/*.trace
            engine/smoke/*.json.gz
            engine/smoke/*.syms.json
            engine/smoke/*.sym.gz
          if-no-files-found: warn
