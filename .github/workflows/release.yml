name: Release (versión jugable)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and publish as a Release (e.g. v0.1.0); empty = artifact only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build
        run: cargo build --release --locked -p sandbox -p forja_fetch

      - name: Package Forja-Windows.zip
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE/dist/Forja"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/release/sandbox.exe "$out/Forja.exe"
          Copy-Item target/release/forja_fetch.exe "$out/forja_fetch.exe"
          Copy-Item -Recurse data "$out/data"
          Copy-Item apps/sandbox/release/Jugar.bat "$out/Jugar.bat"
          Copy-Item apps/sandbox/release/LEEME.txt "$out/LEEME.txt"
          python ../.github/scripts/licencias.py data/assets.toml "$out/LICENCIAS.txt"
          Compress-Archive -Path "$out" -DestinationPath "$env:GITHUB_WORKSPACE/dist/Forja-Windows.zip"
          Get-Item "$env:GITHUB_WORKSPACE/dist/Forja-Windows.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Forja-Windows
          path: dist/Forja-Windows.zip
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/Forja-Windows.zip
          name: Forja ${{ inputs.tag || github.ref_name }} (versión jugable)
          body: |
            Versión jugable de Forja para Windows 10/11 (64 bits, GPU con DirectX 12).

            1. Descarga **Forja-Windows.zip** y descomprímelo en cualquier carpeta.
            2. Abre **Jugar.bat**. El primer arranque descarga el contenido libre (~0,8-1 GB); después arranca directamente.

            Controles, requisitos y licencias en `LEEME.txt` y `LICENCIAS.txt` dentro del ZIP.
